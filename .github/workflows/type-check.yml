name: Type Checks

on:
  push:
    branches:
     - main
     - master
     - next
     - 'v*'
     - voxpelli/type-ci
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: TS ${{ matrix.ts_version }} with "${{ matrix.ts_lib }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts_version: [4.5, 4.6, 4.7, 4.8, 4.9, 5.0, 5.1]
        ts_lib: [es2015, es2020, esnext]
        ts_working_directory: [.]
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
      - uses: actions/cache@v3
        id: check-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: install fastify
        run: |
          npm install --ignore-scripts

      - name: npm install working directory
        if: matrix.ts_working_directory != '.'
        run: npm install --ignore-scripts
        working-directory: ${{ matrix.ts_working_directory }}

      - name: install typescript version ${{ matrix.ts_version }}
        run: npm install --force typescript@${{ matrix.ts_version }}
        working-directory: ${{ matrix.ts_working_directory }}

      - name: show installed typescript version
        run: npm list typescript --depth=0
        working-directory: ${{ matrix.ts_working_directory }}

      - name: test using lib "${{ matrix.ts_lib }}"
        if: matrix.ts_working_directory == '.'
        run: npx tsc -p tsconfig.eslint.json --lib ${{ matrix.ts_lib }}
        working-directory: ${{ matrix.ts_working_directory }}

      - name: test using lib "${{ matrix.ts_lib }}"
        if: matrix.ts_working_directory != '.'
        run: npx tsc --lib ${{ matrix.ts_lib }}
        working-directory: ${{ matrix.ts_working_directory }}
